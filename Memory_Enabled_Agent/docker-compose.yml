version: '3.8'

services:
  nhs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhs-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Uncomment if you need to mount a credentials file
      # - ~/.config/gcloud:/root/.config/gcloud
    networks:
      - nhs-network

networks:
  nhs-network:
    driver: bridge 