version: '3.8'

services:
  nhs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhs-agent
    restart: unless-stopped
    ports:
      - "8080:8080"  # Main LiveKit agents port
      - "7880:7880"  # Additional port for LiveKit web interface (if needed)
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    networks:
      - nhs-network
    # If you want to check logs directly
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nhs-network:
    driver: bridge 